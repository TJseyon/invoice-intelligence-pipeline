[pytest]
; Root cause of "ModuleNotFoundError: No module named 'app'":
; `uvicorn app.main:app` (used to serve the app) adds the current directory
; to sys.path itself when resolving that import string. The `pytest` console
; script does NOT do this by default -- only `python -m pytest` does, via
; the -m flag. Setting pythonpath here makes `pytest` behave the same way
; no matter how it's invoked (bare `pytest`, `python -m pytest`, or from
; `docker compose exec`), which is what actually fixes it.
pythonpath = .
testpaths = tests
